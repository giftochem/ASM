# Step 7B: TLS-terminating reverse proxy in front of `app`.
#
# Certs referenced below are self-signed placeholders (see
# docker/nginx/generate-self-signed-cert.ps1 and docs/deployment.md) --
# no real domain exists yet. Swap ssl_certificate/ssl_certificate_key for
# a CA-issued cert (Let's Encrypt/ACME or otherwise) when one exists;
# nothing else in this file needs to change to do that.
#
# Backend route prefixes are listed explicitly rather than proxying
# everything through: if a new top-level router prefix is added in
# backend/app/api/routes/__init__.py, it must also be added here, or
# requests to it will fall through to the SPA location and get served
# index.html instead of reaching the API. Current prefixes mirror
# api_router's registered routers plus /health (defined directly on the
# FastAPI app) and FastAPI's own /docs, /redoc, /openapi.json.
#
# Stage D.1: some SPA pages share their paths with API endpoints
# (/assets, /assets/<id>, /alerts, /scans, /scans/<id>, /findings,
# /reports). A browser page load of one of them -- a hard refresh, a
# bookmark, a new tab -- must get the SPA, not the API's JSON or 401. So
# such a request is served index.html only when it is a page load
# (GET/HEAD with an Accept that includes text/html; the SPA's fetch()
# calls send */*) AND its path is exactly one of those page shapes, with
# UUID-shaped ids. Every other request under an API prefix -- every API
# call, every write, /assets/activity, /reports/<id>/download, /docs --
# is proxied exactly as before. frontend/src/lib/spaPageLoads.ts is the
# same rule for the Vite dev server; its tests check the two agree, and
# docker/nginx/test-routing.sh exercises this file in a real nginx.
#
# Those paths now have two representations, so their responses carry
# `Vary: Accept`, and the HTML one `Cache-Control: no-cache`: a cache
# must never hand the page to an API call or the JSON to a page load.
# (map runs in the http context this file is included into; $request_uri
# is the original request, unchanged by the internal rewrite below.)
map $request_uri $asm_spa_page_path {
    "~^/(assets|alerts|scans|findings|reports)/?(\?.*)?$" 1;
    "~^/(assets|scans)/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/?(\?.*)?$" 1;
    default 0;
}

map "$request_method:$asm_spa_page_path:$http_accept" $asm_spa_page_load {
    "~*^(GET|HEAD):1:.*text/html" 1;
    default 0;
}

map $asm_spa_page_path $asm_vary {
    1 "Accept";
    default "";
}

map $asm_spa_page_load $asm_page_cache_control {
    1 "no-cache";
    default "";
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Empty everywhere except the shared SPA/API paths (see the maps
    # above) -- nginx omits a header whose value is empty.
    add_header Vary $asm_vary always;
    add_header Cache-Control $asm_page_cache_control always;
    # HSTS is deliberately omitted while the cert is self-signed: it would
    # tell browsers to refuse plain HTTP on this host for months, which is
    # painful to walk back during early setup. Add it once a real,
    # browser-trusted cert is in place:
    #   add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10m;

    location ~ ^/(auth|users|assets|scans|reports|audit-logs|findings|discovery|alerts|health|docs|redoc|openapi\.json) {
        # A browser page load of an SPA page sharing this path (see the
        # maps above) gets the SPA; `rewrite ... last` inside `if` is one
        # of the documented-safe uses of `if` in a location.
        if ($asm_spa_page_load) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately $remote_addr (overwrite), not the common
        # $proxy_add_x_forwarded_for (append): app/core/client_ip.py
        # trusts the FIRST entry of X-Forwarded-For once nginx's peer IP
        # is itself trusted. Appending would let a client prepend their
        # own spoofed IP ahead of nginx's real one and have it believed;
        # overwriting discards whatever the client sent and forwards only
        # what nginx itself observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
