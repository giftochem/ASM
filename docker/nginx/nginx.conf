# Step 7B: TLS-terminating reverse proxy in front of `app`.
#
# Certs referenced below are self-signed placeholders (see
# docker/nginx/generate-self-signed-cert.ps1 and docs/deployment.md) --
# no real domain exists yet. Swap ssl_certificate/ssl_certificate_key for
# a CA-issued cert (Let's Encrypt/ACME or otherwise) when one exists;
# nothing else in this file needs to change to do that.
#
# Backend route prefixes are listed explicitly rather than proxying
# everything through: if a new top-level router prefix is added in
# backend/app/api/routes/__init__.py, it must also be added here, or
# requests to it will fall through to the SPA location and get served
# index.html instead of reaching the API. Current prefixes mirror
# api_router's registered routers plus /health (defined directly on the
# FastAPI app) and FastAPI's own /docs, /redoc, /openapi.json.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS is deliberately omitted while the cert is self-signed: it would
    # tell browsers to refuse plain HTTP on this host for months, which is
    # painful to walk back during early setup. Add it once a real,
    # browser-trusted cert is in place:
    #   add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10m;

    location ~ ^/(auth|users|assets|scans|reports|audit-logs|findings|discovery|alerts|health|docs|redoc|openapi\.json) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately $remote_addr (overwrite), not the common
        # $proxy_add_x_forwarded_for (append): app/core/client_ip.py
        # trusts the FIRST entry of X-Forwarded-For once nginx's peer IP
        # is itself trusted. Appending would let a client prepend their
        # own spoofed IP ahead of nginx's real one and have it believed;
        # overwriting discards whatever the client sent and forwards only
        # what nginx itself observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
