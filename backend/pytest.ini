[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v
# These three are all raised from inside third-party library internals
# (not our code — verified by module) on every run, regardless of what
# we do: passlib's crypt import (unmaintained lib), reportlab's ast usage
# predating Python's ast.Constant, and python-jose's internal use of
# datetime.utcnow(). Filtered narrowly by exact module so a warning from
# our own code is never silently hidden by this.
filterwarnings =
    ignore::DeprecationWarning:passlib.utils
    ignore::DeprecationWarning:reportlab.lib.rl_safe_eval
    ignore::DeprecationWarning:jose.jwt
