name: Secret scan

# Added in Step 7A remediation (finding C-1) after a real secret-bearing
# .env.example was committed and had to be rotated + purged from history.
# This won't actually run anywhere until this repository has a remote —
# it's added now so it's in place the moment one exists, not as a
# currently-active check.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
