# Production posture (Step 7B remediation). Deliberately a standalone
# file, not a docker-compose.yml override: relying on Compose's list-merge
# semantics to *remove* the dev file's host port and source bind-mount
# would be a security-relevant control (no direct host access to `app`,
# no live-editable source in prod) resting on merge behavior that's easy
# to get subtly wrong across Compose versions. A full standalone file
# makes exactly what runs in production auditable by reading one file.
#
# Run with:
#   docker compose -p asm-prod -f docker-compose.prod.yml up -d --build
#
# The explicit -p matters if docker-compose.yml's dev stack might be
# running on the same host: Compose's project name defaults to the
# directory name regardless of -f, so omitting -p here would target the
# SAME project ("asm") as the dev stack instead of a separate one —
# confirmed empirically (a bare `up` without -p failed on a Docker
# network-pool overlap against a concurrently-started asm-prod stack,
# rather than touching the dev containers, but it's not a state worth
# relying on).
#
# See docs/deployment.md for the one-time setup steps (frontend build,
# self-signed cert) this depends on.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asm}
    volumes:
      - asm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asm_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asm_net

  app:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Hardcoded here, not in .env: this value is derived from nginx's
      # static address below, fixed by this file's own topology, not a
      # per-deployment secret. Putting it in the shared .env instead once
      # caused a regression (test_client_ip.py's guard against a non-empty
      # default for the plain dev stack) -- .env is shared between
      # docker-compose.yml and this file, so a value only correct for one
      # of them doesn't belong there.
      TRUSTED_PROXY_IPS_RAW: "172.28.0.10"
      # Same reasoning: this file IS the production posture, so this is
      # unconditionally correct here and would be a footgun in the shared
      # .env (it would also flip the dev stack's cookies to Secure=true,
      # which plain HTTP dev traffic can't carry -- browsers drop them).
      ENVIRONMENT: production
    # No host port: reached only via nginx, over the internal network.
    # No source bind-mount, no --reload override: this runs the image
    # exactly as built (COPY . . baked in at build time), the same
    # artifact that would be pushed to a registry -- not live host
    # source, which is a dev-only convenience (see docker-compose.yml).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - asm_net

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Pinned here for the same reason as on `app` (Stage D.2B): the
      # worker executes discovery runs, and the test-only provider gate
      # (app/discovery/registry.py) trusts ENVIRONMENT. A literal in
      # `environment:` overrides whatever the shared .env says.
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asm_net
    command: celery -A app.celery_app worker --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    # Loopback only by default (Stage D.2B): the beta is meant to run on
    # the machine it's installed on. Serving other machines is a
    # deliberate step -- see "Exposing it beyond this machine" in
    # docs/deployment.md (self-registration is open; the cert is a
    # self-signed placeholder).
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      asm_net:
        # Static IP so app/config.py's TRUSTED_PROXY_IPS_RAW can name it
        # deterministically -- see app/core/client_ip.py for why an
        # unlisted (untrusted) proxy peer is the safe default. That value
        # is hardcoded on `app` above, never set in .env -- the same
        # reasoning that pins ENVIRONMENT: production on app and worker
        # (docs/deployment.md, one-time setup steps 3 and 4).
        ipv4_address: 172.28.0.10

networks:
  asm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  asm_pgdata:
